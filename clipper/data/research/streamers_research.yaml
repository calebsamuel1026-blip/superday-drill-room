clipping_landscape:
  notes:
    - "Whop Content Rewards: campaign owner sets CPM (typ. $0.20-$6 per 1k views, avg ~$1; gaming median ~$1.41/1k in a Nov 2026 snapshot), approves clips, 10% fee, budgets can run out before late clips are paid."
    - "Kick runs a clipping program (made official Dec 2025 per win.gg; reported 3B views in Sep 2025) but sources disagree whether Kick pays clippers directly; part of N3on's ~1,000-clipper network is reportedly paid by Kick."
    - "N3on paid ~$1.4M to 303 clippers over 5 weeks at ~$40 per 100k views (Tubefilter, Apr 2026). Network co-built with Adin Ross."
    - "No verifiable official paid clipping program found for Kai Cenat, IShowSpeed, xQc, or any ES/PT creator. Check Whop Content Rewards / Vyro / creator Discords live before posting."
    - "PT-BR: 'canais de cortes' culture - many streamers have official/endorsed cut channels (e.g. 'cortes paulinho o loko [oficial]'), terms not public."
  sources:
    - "https://docs.whop.com/manage-your-business/growth-marketing/content-rewards"
    - "https://www.clipspeed.ai/blog/whop-content-rewards-clipping-guide.html"
    - "https://win.gg/kick-clipping-program/"
    - "https://findclout.com/blog/kick-clipping-program"
    - "https://www.tubefilter.com/2026/04/29/n3on-spending-millions-stream-clippers-tiktok-kick/amp/"
    - "https://sportskeeda.com/esports/news-what-thumb-media-agency-fire-adin-ross-ishowspeed-get-accused-copyright-striking-youtubers"
    - "https://contentrewards.com/blog/get-paid-clip-streamers"

