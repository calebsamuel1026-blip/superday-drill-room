# =====================================================================================
chat_lexicon:
  # Tokens for chat-spike hype detector. Match case-insensitively; collapse repeated letters
  # (regex e.g. k{4,}, ja(ja)+, KEK\w*). Weight emote-only messages higher. Source: domain
  # knowledge of Twitch/Kick/7TV/BTTV/FFZ culture - not web-verified per community.
  en:
    laughter: ["KEKW", "OMEGALUL", "LUL", "LULW", "LMAO", "LMFAO", "LOL", "ICANT", "pepeLaugh", "KEKL", "💀", "😭", "😂", "HAHAHA", "DEAD", "I'M DEAD", "bro", "crying"]
    hype: ["W", "WWW", "POG", "PogChamp", "Pog", "PogU", "POGGERS", "LETS GO", "LETSGO", "GOATED", "HOLY", "HOLY SHIT", "NO WAY", "NAHHH", "NAH", "CLIP IT", "CLIP THAT", "+2", "EZ", "GIGACHAD", "Clap", "🔥", "🐐"]
    shock: ["WHAT", "WTF", "monkaS", "monkaW", "D:", "Aware", "Stare", "OMG", "BRO", "😳", "😱"]
    rage_fail: ["L", "LLL", "Sadge", "PepeHands", "BibleThump", "ResidentSleeper", "F", "FFFF", "RIP", "COPIUM", "Clueless"]
  es:
    laughter: ["jajaja", "JAJAJA", "jaja", "JAJSJAJS", "jsjsjs", "JSJSJS", "ajajaj", "XD", "XDDD", "xd", "KEKW", "OMEGALUL", "LUL", "😂", "🤣", "💀", "me meo", "me muero", "lmao"]
    hype: ["QUE", "QUEEE", "QUÉ", "NOOO", "NOOOO", "VAMOS", "VAMOOOS", "BRUTAL", "CRACK", "GOD", "GOAT", "POG", "W", "GG", "TREMENDO", "INSANO", "CLIP", "CLIPEA", "QUE ACABA DE PASAR", "NO PUEDE SER", "🔥"]
    shock: ["WTF", "OMG", "hostia", "ostia", "joder", "madre mía", "qué cojones", "NMMS (MX)", "ALV (MX)", "no mames (MX)", "WEY", "NAAA (AR)", "BOLUDO (AR)", "uy no (CO)", "parce (CO)", "😳", "😱"]
    rage_fail: ["F", "FFFF", "L", "RIP", "manco", "MANCO", "que malo", "nooo", "Sadge", "PepeHands", "F en el chat"]
  pt:
    laughter: ["kkkk", "kkkkkkkk", "KKKKKKKK", "KKKKKKKKKKKKK", "kkkkk", "rsrs", "hahaha", "huehue", "KEKW", "OMEGALUL", "LUL", "😂", "🤣", "💀", "chorando", "to chorando", "morri", "MORRI", "SOCORRO"]
    hype: ["CARALHO", "CARALHOOO", "PQP", "MDS", "MEU DEUS", "VAMO", "VAMOOO", "BORA", "INSANO", "BRABO", "BRABOOO", "MONSTRO", "LENDA", "W", "POG", "CLIPA", "CLIPA ISSO", "NÃO ACREDITO", "🔥", "🐐"]
    shock: ["OQ", "OQUE", "OQUEEE", "QUE ISSO", "QUE ISSO MANO", "MANO", "NAMORAL", "NA MORAL", "VTNC", "WTF", "AAAAAA", "😳", "😱", "Gzuis"]
    rage_fail: ["F", "FFFF", "L", "RIP", "RUIM", "Sadge", "pepeHands", "que fase", "tnc", "vish", "VISH"]
  detector_tips:
    - "Count unique chatters per 5-10s window vs rolling baseline (z-score), not raw messages."
    - "Normalize repeats: collapse k{3,} -> kkk, (ja){2,} -> jaja, (ha){2,} -> haha; uppercase ratio is a strong hype signal."
    - "Emote-only messages and identical copy-paste spam (e.g. 'KEKW KEKW KEKW') are high-weight."
    - "Kick and Twitch chats differ: Kick uses Kick/7TV emotes (KEKW, emojis); BR chats overwhelmingly use 'k' spam."
