# GTA 6 clipping target research - compiled 2026-11-16
# Method: web search only (direct page fetches to streamscharts.com / win.gg were blocked in this
# sandbox, so figures come from search-result snippets + prior knowledge).
# Convention: anything not confirmed by a 2026 source is tagged "unverified". Follower counts are
# approximate, mostly from pre-2026 knowledge, and should be refreshed from Streams Charts /
# SullyGnome / Social Blade before use.

meta:
  compiled: "2026-11-16"
  caveats:
    - "Follower/viewer numbers are approximate and largely unverified for Nov 2026."
    - "'clipping_program' = whether a paid/official program is publicly documented. Almost none were verifiable; Kick-side programs and N3on/Adin network are the exceptions."
    - "GTA 6 launches single-player only on console. No GTA 6 RP servers exist at launch (no PC version, no FiveM for GTA 6). RP drama clips will keep coming from GTA V servers in parallel."
    - "Copyright: clips contain both streamer footage (streamer's IP) and Rockstar footage. Rockstar historically tolerates/permits gameplay videos, but story spoilers and leaked content are higher-risk; confirm Rockstar's current video policy. Some streamers (Adin Ross, IShowSpeed) have been accused of mass copyright-striking YouTube clip/reupload channels via the agency Thumb Media."

