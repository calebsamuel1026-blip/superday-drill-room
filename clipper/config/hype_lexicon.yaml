# Chat vocabulary that signals "something just happened".
# weight = how much one occurrence adds on top of the plain message count.
# Matching is case-insensitive, on whole tokens unless `regex: true`.
# Category tags let the agent know WHAT kind of moment it is (laugh vs shock vs hype vs rage).

common:
  - {token: "KEKW", weight: 1.5, tag: laugh}
  - {token: "OMEGALUL", weight: 1.8, tag: laugh}
  - {token: "LUL", weight: 1.2, tag: laugh}
  - {token: "LULW", weight: 1.3, tag: laugh}
  - {token: "ICANT", weight: 1.6, tag: laugh}
  - {token: "OMEGADANCE", weight: 1.0, tag: hype}
  - {token: "Pog", weight: 1.3, tag: hype}
  - {token: "PogChamp", weight: 1.3, tag: hype}
  - {token: "POGGERS", weight: 1.3, tag: hype}
  - {token: "PogU", weight: 1.3, tag: hype}
  - {token: "monkaS", weight: 1.2, tag: tension}
  - {token: "monkaW", weight: 1.4, tag: tension}
  - {token: "Clueless", weight: 0.8, tag: laugh}
  - {token: "Aware", weight: 0.8, tag: laugh}
  - {token: "Sadge", weight: 0.6, tag: sad}
  - {token: "D:", weight: 1.3, tag: shock}
  - {token: "WutFace", weight: 1.2, tag: shock}
  - {token: "Kappa", weight: 0.4, tag: laugh}
  - {token: "💀", weight: 1.6, tag: laugh}
  - {token: "😭", weight: 1.3, tag: laugh}
  - {token: "😂", weight: 1.2, tag: laugh}
  - {token: "🤣", weight: 1.2, tag: laugh}
  - {token: "🔥", weight: 0.8, tag: hype}
  - {token: "😱", weight: 1.2, tag: shock}
  - {token: "CLIP", weight: 2.5, tag: clip_request}
  - {token: "CLIPPED", weight: 2.5, tag: clip_request}
  - {token: "CLIP IT", weight: 3.0, tag: clip_request}
  - {token: "+2", weight: 1.0, tag: laugh}
  - {token: "W", weight: 0.9, tag: hype}
  - {token: "L", weight: 0.7, tag: fail}
  - {token: "GG", weight: 0.6, tag: hype}
  - {token: "?", weight: 0.5, tag: shock}
  - {token: "???", weight: 1.0, tag: shock}

